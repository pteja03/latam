# Agenda Medica Inteligente - Clinica CREE (DEP-01)
#
#   Desarrollo:  docker compose up -d
#                (api_core :8000, api_webhooks :8001 y ui :8550, solo en localhost)
#   Produccion:  docker compose --profile produccion up -d
#                (agrega el proxy con TLS; publica solo 80/443)

x-app: &app
  build: .
  image: agenda-cree:latest
  env_file: .env
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  depends_on:
    migraciones:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agenda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: agenda
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda -d agenda"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - datos_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Aplica las migraciones una vez antes de levantar los servicios.
  migraciones:
    build: .
    image: agenda-cree:latest
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api_core:
    <<: *app
    command:
      ["uvicorn", "app.api_core.main:app", "--host", "0.0.0.0", "--port", "8000",
       "--proxy-headers", "--forwarded-allow-ips", "*"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck: &salud_http
      test:
        ["CMD", "python", "-c",
         "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.http.routers.api_core.rule=Host(`${DOMINIO:-localhost}`) && PathPrefix(`/api`)
      - traefik.http.routers.api_core.entrypoints=websecure
      - traefik.http.routers.api_core.tls.certresolver=le
      - traefik.http.routers.api_core.middlewares=cabeceras@docker,limite_api@docker
      - traefik.http.services.api_core.loadbalancer.server.port=8000

  api_webhooks:
    <<: *app
    command:
      ["uvicorn", "app.api_webhooks.main:app", "--host", "0.0.0.0", "--port", "8000",
       "--proxy-headers", "--forwarded-allow-ips", "*"]
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck: *salud_http
    labels:
      - traefik.enable=true
      - traefik.http.routers.api_webhooks.rule=Host(`${DOMINIO:-localhost}`) && PathPrefix(`/webhooks`)
      - traefik.http.routers.api_webhooks.entrypoints=websecure
      - traefik.http.routers.api_webhooks.tls.certresolver=le
      - traefik.http.routers.api_webhooks.middlewares=cabeceras@docker
      - traefik.http.services.api_webhooks.loadbalancer.server.port=8000

  worker:
    <<: *app
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel", "INFO", "--concurrency", "4"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3

  beat:
    <<: *app
    command:
      ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel", "INFO",
       "--schedule", "/tmp/celerybeat-schedule"]

  ui:
    <<: *app
    command: ["python", "-m", "ui.main"]
    environment:
      API_CORE_URL: http://api_core:8000/api
      UI_PUERTO: "8550"
    depends_on:
      api_core:
        condition: service_healthy
    ports:
      - "127.0.0.1:8550:8550"
    labels:
      - traefik.enable=true
      - traefik.http.routers.ui.rule=Host(`${DOMINIO:-localhost}`)
      - traefik.http.routers.ui.entrypoints=websecure
      - traefik.http.routers.ui.tls.certresolver=le
      - traefik.http.routers.ui.middlewares=cabeceras@docker
      - traefik.http.services.ui.loadbalancer.server.port=8550

  # ARQ-06 / DEP-02: proxy inverso con TLS de Let's Encrypt. Solo en produccion.
  proxy:
    image: traefik:v3.1
    profiles: ["produccion"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certificados:/letsencrypt
    labels:
      - traefik.enable=true
      # Cabeceras de seguridad para todas las rutas.
      - traefik.http.middlewares.cabeceras.headers.stsSeconds=31536000
      - traefik.http.middlewares.cabeceras.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.cabeceras.headers.contentTypeNosniff=true
      - traefik.http.middlewares.cabeceras.headers.frameDeny=true
      - traefik.http.middlewares.cabeceras.headers.referrerPolicy=no-referrer
      # Limite de peticiones por IP hacia api_core (frena fuerza bruta en el login).
      - traefik.http.middlewares.limite_api.ratelimit.average=20
      - traefik.http.middlewares.limite_api.ratelimit.burst=40

volumes:
  datos_postgres:
  datos_redis:
  certificados:
