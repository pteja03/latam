[project]
name = "agenda-medica-cree"
version = "0.1.0"
description = "Agenda Medica Inteligente - Clinica CREE"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=42",
    "celery>=5.4",
    "redis>=5.0",
    "google-genai>=1.0",
    "httpx>=0.27",
    "pyjwt>=2.8",
    # Windows no trae la base de zonas horarias IANA que usa zoneinfo.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Web: flet + flet-web. Para escritorio instalar ademas flet-desktop.
ui = ["flet>=1.0", "flet-web>=1.0"]
# Empaquetado de la app de escritorio para Windows (ver instalador/).
escritorio = ["flet>=1.0", "flet-desktop>=1.0", "flet-cli>=1.0", "pyinstaller>=6", "tzdata"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "flet>=1.0", "flet-web>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "ui*", "escritorio*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
