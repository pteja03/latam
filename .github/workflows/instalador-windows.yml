name: Instalador de Windows

on:
  workflow_dispatch:
  push:
    branches: [desarrollo, main]
    tags: ["v*"]
    paths:
      - "app/**"
      - "ui/**"
      - "escritorio/**"
      - "instalador/**"
      - "migrations/**"
      - "pyproject.toml"
      - ".github/workflows/instalador-windows.yml"

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install ".[escritorio]"

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Construir ejecutable e instalador
        shell: pwsh
        run: ./instalador/construir.ps1

      - name: Prueba de humo
        shell: pwsh
        run: ./instalador/prueba_humo.ps1

      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: CREE-Agenda-Instalador
          path: dist/CREE-Agenda-Instalador-*.exe
          if-no-files-found: error

      - name: Adjuntar a la version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CREE-Agenda-Instalador-*.exe
